aid: kanarys
name: Kanarys
description: >-
  Kanarys, Inc. was a Dallas, Texas workforce-analytics company founded in 2018 by
  Mandy Price, Star Carter and Bennie King. Its SaaS platform combined employee
  experience surveys, demographic and cultural data, anonymous employee reviews and
  peer benchmarking to give enterprise HR and diversity leaders analytics on workplace
  inclusion. Integration with customer HRIS, ATS and payroll systems was delivered as
  managed, per-customer connectors run by Kanarys staff rather than as a self-serve
  public API, and the company never published a developer portal, an OpenAPI or any
  other machine-readable contract. Kanarys raised a $5M Series A, counted 7-Eleven and
  Yum! Brands among its customers, and in mid-2024 sold its intellectual property and
  name to a special-purpose vehicle formed by a group of former chief diversity
  officers; co-founder Mandy Price left for the Draper Richards Kaplan Foundation in
  February 2025. The company now operates no public web surface: kanarys.com served
  the real site as recently as 22 April 2026 and is a GoDaddy parking lander as of
  17 May 2026, and no successor domain resolves.
